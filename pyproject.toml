[project]
name = "rent-agent"
version = "0.1.0"
description = "사회초년생/무주택자를 위한 전세 리스크 판단 멀티에이전트 (LangGraph + RAG)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    # ragas 0.4.3이 langchain_community.chat_models.vertexai를 import함 → 0.4.x와 충돌. ADR-0005
    "langchain-community==0.3.31",
    "langgraph>=1.2,<2",
    "langgraph-supervisor>=0.0.31,<0.1",
    "langgraph-checkpoint>=4.2,<5",
    "chromadb>=1.5,<2",
    "langsmith>=0.12,<1",
    "streamlit>=1.63,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "xmltodict>=1.0,<2",
    "python-frontmatter>=1.1,<2",
    "ragas==0.4.3",
    "openai>=1.60,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rent_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 외부 API(OpenAI 등) 호출이 필요한 테스트. CI에서는 제외"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
